# FluxCore Tiny Tapeout project information
project:
  title: "FluxCore"
  author: "Nitin Swarnkar"
  discord: "nitin2468"
  description: "A 2x2 coarse-grained reconfigurable array with configurable 32-bit processing elements."
  language: "Amaranth"
  clock_hz: 0
  tiles: "3x4"
  top_module: "tt_um_fluxcore"
  source_files:
    - "tt_um_fluxcore.v"

pinout:
  # Inputs
  ui[0]: "config_data"
  ui[1]: "config_clk"
  ui[2]: "config_enable"
  ui[3]: "execute"
  ui[4]: "operand_data"
  ui[5]: "operand_valid"
  ui[6]: "read_result"
  ui[7]: "result_source (0=PE result, 1=accumulator)"

  # Outputs
  uo[0]: "serial_result_data"
  uo[1]: "busy_pulse"
  uo[2]: "config_done"
  uo[3]: "done_pulse"
  uo[4]: "result_valid"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins are used as inputs for PE selection; the design drives
  # uio_oe=0 and uio_out=0.
  uio[0]: "pe_index[0]"
  uio[1]: "pe_index[1]"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
