# Tiny Tapeout project information
project:
  title:        "4-Neuron Configurable 0-DSP LIF Array"
  author:       "Tianyue"
  discord:      ""
  description:  "4-neuron configurable 0-DSP LIF spiking array with selectable shift-leak and modes"
  language:     "Verilog"
  clock_hz:     25000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tianyue_snn_array"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "spike_in[0]"
  ui[1]: "spike_in[1]"
  ui[2]: "spike_in[2]"
  ui[3]: "spike_in[3]"
  ui[4]: "shift_sel[0]"
  ui[5]: "shift_sel[1]"
  ui[6]: "mode[0]"
  ui[7]: "mode[1]"

  # Outputs
  uo[0]: "spike_out[0]"
  uo[1]: "spike_out[1]"
  uo[2]: "spike_out[2]"
  uo[3]: "spike_out[3]"
  uo[4]: "mem_pos[0]"
  uo[5]: "mem_pos[1]"
  uo[6]: "mem_pos[2]"
  uo[7]: "mem_pos[3]"

  # Bidirectional pins
  uio[0]: "mem0[0]"
  uio[1]: "mem0[1]"
  uio[2]: "mem0[2]"
  uio[3]: "mem0[3]"
  uio[4]: "mem0[4]"
  uio[5]: "mem0[5]"
  uio[6]: "mem0[6]"
  uio[7]: "mem0[7]"

# Do not change!
yaml_version: 6
